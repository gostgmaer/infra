name: Deploy Infra Stack

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: infra-deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run remote deployment over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -e

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            DEPLOY_BRANCH="${{ secrets.DEPLOY_BRANCH }}"
            GIT_REPO_URL="${{ secrets.GIT_REPO_URL }}"
            SERVER_ENV_FILE_B64="${{ secrets.SERVER_ENV_FILE_B64 }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="$HOME/infra"
              echo "DEPLOY_PATH not set, defaulting to $DEPLOY_PATH"
            fi

            if command -v git >/dev/null 2>&1; then
              :
            else
              echo "git is not installed on target server"
              exit 1
            fi

            if command -v docker >/dev/null 2>&1; then
              :
            else
              echo "docker is not installed on target server"
              exit 1
            fi

            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "Docker Compose is not installed on target server"
              exit 1
            fi

            ARCH="$(uname -m)"
            if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
              export DOCKER_DEFAULT_PLATFORM=linux/arm64
            elif [ "$ARCH" = "x86_64" ] || [ "$ARCH" = "amd64" ]; then
              export DOCKER_DEFAULT_PLATFORM=linux/amd64
            else
              echo "Unsupported architecture: $ARCH"
              exit 1
            fi

            echo "Server architecture: $ARCH"
            echo "Using DOCKER_DEFAULT_PLATFORM=$DOCKER_DEFAULT_PLATFORM"

            if [ -z "$GIT_REPO_URL" ]; then
              echo "GIT_REPO_URL secret is missing"
              exit 1
            fi

            if [ -z "$DEPLOY_BRANCH" ]; then
              if git ls-remote --exit-code --heads "$GIT_REPO_URL" main >/dev/null 2>&1; then
                DEPLOY_BRANCH="main"
              elif git ls-remote --exit-code --heads "$GIT_REPO_URL" master >/dev/null 2>&1; then
                DEPLOY_BRANCH="master"
              else
                echo "Neither main nor master branch exists in $GIT_REPO_URL"
                exit 1
              fi
              echo "DEPLOY_BRANCH not set, auto-selected $DEPLOY_BRANCH"
            fi

            mkdir -p "$DEPLOY_PATH" || { echo "ERROR: Cannot create $DEPLOY_PATH"; exit 1; }
            echo "Deploy path ready: $DEPLOY_PATH"

            echo "Checking for existing git repo at $DEPLOY_PATH/.git"
            if [ -d "$DEPLOY_PATH/.git" ]; then
              echo "Repository already exists"
            else
              if [ -d "$DEPLOY_PATH" ] && [ "$(ls -A "$DEPLOY_PATH" 2>/dev/null)" ]; then
                echo "Directory exists but is not a git repo (stale from failed deploy), cleaning up"
                rm -rf "$DEPLOY_PATH"
                mkdir -p "$DEPLOY_PATH"
              fi
              echo "First deploy: cloning repository from $GIT_REPO_URL branch $DEPLOY_BRANCH"
              if git clone --branch "$DEPLOY_BRANCH" "$GIT_REPO_URL" "$DEPLOY_PATH"; then
                echo "Repository cloned successfully"
              else
                echo "Failed to clone repository"
                exit 1
              fi
            fi

            cd "$DEPLOY_PATH" || { echo "ERROR: Cannot cd into $DEPLOY_PATH"; exit 1; }
            echo "Working directory: $(pwd)"
            set -x

            if [ ! -f .env ] && [ -n "$SERVER_ENV_FILE_B64" ]; then
              echo "Creating .env from SERVER_ENV_FILE_B64 secret"
              printf "%s" "$SERVER_ENV_FILE_B64" | base64 -d 2>/dev/null > .env || printf "%s" "$SERVER_ENV_FILE_B64" | base64 -D > .env
              if [ ! -s .env ]; then
                echo "Failed to decode SERVER_ENV_FILE_B64"
                echo "SERVER_ENV_FILE_B64 length: ${#SERVER_ENV_FILE_B64}"
                exit 1
              fi
              echo ".env created successfully with $(wc -l < .env) lines"
              chmod 600 .env
            else
              if [ -f .env ]; then
                echo ".env already exists, skipping base64 decode"
              else
                echo "No SERVER_ENV_FILE_B64 secret provided"
              fi
            fi

            echo "Updating code from git"
            echo "Fetching from origin $DEPLOY_BRANCH"
            if git fetch origin "$DEPLOY_BRANCH"; then
              echo "Fetch successful"
            else
              echo "Fetch failed"
              exit 1
            fi

            echo "Checking out $DEPLOY_BRANCH"
            if git checkout "$DEPLOY_BRANCH"; then
              echo "Checkout successful"
            else
              echo "Checkout failed"
              exit 1
            fi

            echo "Pulling from origin $DEPLOY_BRANCH"
            if git pull --ff-only origin "$DEPLOY_BRANCH"; then
              echo "Pull successful"
            else
              echo "Pull failed or rejected (non-ff)"
              exit 1
            fi

            if [ ! -f .env ]; then
              echo "ERROR: Missing .env on server at $DEPLOY_PATH/.env"
              echo "Create it once from .env.example before using CI/CD"
              ls -la "$DEPLOY_PATH" || true
              exit 1
            fi

            echo "Deploying containers"
            echo "Pulling latest images"
            $COMPOSE_CMD --env-file .env pull || { echo "Pull failed"; exit 1; }

            echo "Stopping existing containers"
            $COMPOSE_CMD --env-file .env down || true

            echo "Starting containers"
            $COMPOSE_CMD --env-file .env up -d --remove-orphans || { echo "Container startup failed"; exit 1; }
            echo "Containers started successfully"

            echo "Pruning dangling images"
            docker image prune -f
