name: Deploy Infra Stack

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: infra-deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run remote deployment over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -e

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            DEPLOY_BRANCH="${{ secrets.DEPLOY_BRANCH }}"
            GIT_REPO_URL="${{ secrets.GIT_REPO_URL }}"
            SERVER_ENV_FILE_B64="${{ secrets.SERVER_ENV_FILE_B64 }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="/opt/infra"
              echo "DEPLOY_PATH not set, defaulting to $DEPLOY_PATH"
            fi

            if command -v git >/dev/null 2>&1; then
              :
            else
              echo "git is not installed on target server"
              exit 1
            fi

            if command -v docker >/dev/null 2>&1; then
              :
            else
              echo "docker is not installed on target server"
              exit 1
            fi

            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "Docker Compose is not installed on target server"
              exit 1
            fi

            ARCH="$(uname -m)"
            if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
              export DOCKER_DEFAULT_PLATFORM=linux/arm64
            elif [ "$ARCH" = "x86_64" ] || [ "$ARCH" = "amd64" ]; then
              export DOCKER_DEFAULT_PLATFORM=linux/amd64
            else
              echo "Unsupported architecture: $ARCH"
              exit 1
            fi

            echo "Server architecture: $ARCH"
            echo "Using DOCKER_DEFAULT_PLATFORM=$DOCKER_DEFAULT_PLATFORM"

            if [ -z "$GIT_REPO_URL" ]; then
              echo "GIT_REPO_URL secret is missing"
              exit 1
            fi

            if [ -z "$DEPLOY_BRANCH" ]; then
              if git ls-remote --exit-code --heads "$GIT_REPO_URL" main >/dev/null 2>&1; then
                DEPLOY_BRANCH="main"
              elif git ls-remote --exit-code --heads "$GIT_REPO_URL" master >/dev/null 2>&1; then
                DEPLOY_BRANCH="master"
              else
                echo "Neither main nor master branch exists in $GIT_REPO_URL"
                exit 1
              fi
              echo "DEPLOY_BRANCH not set, auto-selected $DEPLOY_BRANCH"
            fi

            if mkdir -p "$DEPLOY_PATH" >/dev/null 2>&1; then
              echo "Using deploy path: $DEPLOY_PATH"
            else
              if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
                echo "No write permission for $DEPLOY_PATH, creating with sudo"
                sudo mkdir -p "$DEPLOY_PATH"
                sudo chown -R "$USER":"$USER" "$DEPLOY_PATH"
              else
                echo "Permission denied for DEPLOY_PATH=$DEPLOY_PATH"
                echo "Set DEPLOY_PATH to a writable directory like /home/$USER/infra, or grant passwordless sudo"
                exit 1
              fi
            fi

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "First deploy: cloning repository"
              git clone --branch "$DEPLOY_BRANCH" "$GIT_REPO_URL" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"

            if [ ! -f .env ] && [ -n "$SERVER_ENV_FILE_B64" ]; then
              echo "Creating .env from SERVER_ENV_FILE_B64 secret"
              printf "%s" "$SERVER_ENV_FILE_B64" | base64 -d 2>/dev/null > .env || printf "%s" "$SERVER_ENV_FILE_B64" | base64 -D > .env
              if [ ! -s .env ]; then
                echo "Failed to decode SERVER_ENV_FILE_B64"
                exit 1
              fi
              chmod 600 .env
            fi

            echo "Updating code from git"
            git fetch origin "$DEPLOY_BRANCH"
            git checkout "$DEPLOY_BRANCH"
            git pull --ff-only origin "$DEPLOY_BRANCH"

            if [ ! -f .env ]; then
              echo "Missing .env on server at $DEPLOY_PATH/.env"
              echo "Create it once from .env.example before using CI/CD"
              exit 1
            fi

            echo "Deploying containers"
            $COMPOSE_CMD --env-file .env pull
            $COMPOSE_CMD --env-file .env up -d --remove-orphans
            docker image prune -f
